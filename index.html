<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Prompt Generator</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --primary: #007bff;
            --text: #333;
            --border: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 1400px;
            /* Wider for grid */
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            align-self: flex-start;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .secondary-btn {
            background-color: #e9ecef;
            color: #333;
            font-size: 14px;
            padding: 8px 16px;
            border: 1px solid #ced4da;
        }

        .secondary-btn:hover {
            background-color: #dde2e6;
            color: #000;
        }

        /* Grid Layout for Prompts */
        #output-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .prompt-card {
            background-color: #f8f9fa;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            height: 500px;
            /* Fixed height for uniformity */
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .prompt-card h3 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            font-size: 1.1em;
        }

        .prompt-content {
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
            line-height: 1.5;
            flex-grow: 1;
        }

        .status {
            font-size: 0.9em;
            color: #666;
            margin-top: -10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Ollama Prompt Generator</h1>

        <div>
            <label for="idea">Was möchtest du bauen?</label>
            <textarea id="idea" placeholder="z.B. Ein Luxus-Schuhshop wie Louis Vuitton..."></textarea>

            <div class="template-buttons" style="margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="secondary-btn" onclick="setTemplate('shop')">🛍️ Online Shop</button>
                <button class="secondary-btn" onclick="setTemplate('portfolio')">🎨 Portfolio</button>
                <button class="secondary-btn" onclick="setTemplate('dashboard')">📊 Admin Dashboard</button>
                <button class="secondary-btn" onclick="setTemplate('webapp')">📱 Web App</button>
            </div>
        </div>

        <div>
            <label for="model">Ollama Model</label>
            <input type="text" id="model" value="gemma3:4b">
        </div>

        <button id="generateBtn" onclick="generatePrompts()">Prompts Generieren</button>
        <div id="status" class="status"></div>

        <div id="output-grid"></div>
    </div>

    <script>
        function setTemplate(type) {
            const textarea = document.getElementById('idea');
            let text = "";

            switch (type) {
                case 'shop':
                    text = "Erstelle einen vollkommen funktionsfähigen Online Shop in den Farben {FARBEN HIER EINGEBEN}, der Name des Shops ist {SHOPNAME} und der Stil {STIL}. Er soll sehr luxuriös wirken.";
                    break;
                case 'portfolio':
                    text = "Erstelle ein beeindruckendes Portfolio für {BERUF/NAME} in den Farben {FARBEN}. Der Stil soll {STIL} sein und meine besten Arbeiten hervorheben.";
                    break;
                case 'dashboard':
                    text = "Erstelle ein umfangreiches Admin Dashboard für {ZWECK} mit Analytics, Benutzerverwaltung und {WEITERE FEATURES}. Stil: Clean und Modern.";
                    break;
                case 'webapp':
                    text = "Erstelle eine komplexe Web App für {ZWECK}. Die App soll folgende Hauptfunktionen haben: {FUNKTION 1}, {FUNKTION 2}. Tech-Stack: Modern und skalierbar.";
                    break;
            }

            textarea.value = text;
            textarea.focus();
        }

        let currentEventSource = null;

        function generatePrompts() {
            const idea = document.getElementById('idea').value.trim();
            const model = document.getElementById('model').value.trim();
            const outputGrid = document.getElementById('output-grid');
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('status');

            if (!idea) {
                alert("Bitte gib eine Idee ein.");
                return;
            }

            if (currentEventSource) {
                currentEventSource.close();
            }

            btn.disabled = true;
            outputGrid.innerHTML = ""; // Clear previous results
            status.textContent = "Generiere... Bitte warten.";

            // Create initial card for streaming content
            let fullText = "";

            // Send POST request to start generation
            fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idea, model })
            }).then(response => {
                if (!response.ok) throw new Error("Netzwerkfehler");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                // Function to process the stream
                function readStream() {
                    reader.read().then(({ done, value }) => {
                        if (done) {
                            status.textContent = "Fertig!";
                            btn.disabled = false;
                            renderGrid(fullText); // Final render
                            return;
                        }

                        const chunk = decoder.decode(value, { stream: true });
                        // Parse SSE format (data: ...)
                        const lines = chunk.split('\n');
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const dataStr = line.substring(6);
                                if (dataStr.trim() === '') continue;
                                try {
                                    if (dataStr.includes("Error connecting")) {
                                        status.textContent = "Fehler: " + JSON.parse(dataStr);
                                        return;
                                    }
                                    const content = JSON.parse(dataStr);
                                    fullText += content;
                                    renderGrid(fullText); // Update grid in real-time
                                } catch (e) {
                                    console.error("JSON Parse Error", e);
                                }
                            } else if (line.startsWith('event: done')) {
                                // handled by done
                            } else if (line.startsWith('event: error')) {
                                // handled above
                            }
                        }
                        readStream();
                    }).catch(err => {
                        status.textContent = "Fehler: " + err;
                        btn.disabled = false;
                    });
                }

                readStream();

            }).catch(e => {
                status.textContent = "Fehler: " + e.message;
                btn.disabled = false;
            });
        }

        function renderGrid(text) {
            const outputGrid = document.getElementById('output-grid');
            // Split by the separator defined in Python
            const prompts = text.split('|||PROMPT_START|||');

            // Clear grid to re-render (inefficient but simple for real-time)
            outputGrid.innerHTML = "";

            prompts.forEach((promptText, index) => {
                if (promptText.trim() === "") return;

                const card = document.createElement('div');
                card.className = 'prompt-card';

                // Try to extract a title if possible (e.g. first line)
                let title = `Prompt ${index}`;
                let content = promptText.trim();

                // Simple heuristic: First line is title if short
                const lines = content.split('\n');
                if (lines.length > 0 && lines[0].length < 50 && (lines[0].includes("Prompt") || lines[0].includes(":"))) {
                    title = lines[0];
                    content = lines.slice(1).join('\n').trim();
                }

                card.innerHTML = `
                <h3>${title}</h3>
                <div class="prompt-content">${content}</div>
            `;
                outputGrid.appendChild(card);
            });
        }
    </script>


</body>

</html>
